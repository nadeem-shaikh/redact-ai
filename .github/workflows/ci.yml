name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # v0.1 CI gates on Linux py3.11 + py3.12 only (DoD §3). NFR-7.1
    # lists macOS as a "SHOULD" target; cross-platform Tesseract output
    # variance is a known v0.1 limitation and is tracked separately
    # rather than gating PR merges on it.
    name: lint + types + tests (py${{ matrix.python }} / ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Download spaCy NER model (ID-006, ADR-011)
        run: uv run python -m spacy download en_core_web_md

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Generate golden fixtures
        run: uv run python tests/golden/_generate.py

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      - name: Golden tests
        run: uv run pytest tests/golden -q

      - name: Coverage gate (overall ≥85%, redact + merge 100%)
        run: |
          uv run pytest \
            --cov=redact_ai \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=term \
            -q
          uv run pytest tests/unit/pipeline/test_redact.py tests/unit/pipeline/test_merge.py tests/golden \
            --cov=redact_ai.pipeline.redact \
            --cov=redact_ai.pipeline.merge \
            --cov-branch \
            --cov-fail-under=100 \
            -q
