name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Generate golden fixtures
        run: uv run python tests/golden/_generate.py

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      - name: Golden tests
        run: uv run pytest tests/golden -q

      - name: Coverage gate (overall ≥85%, redact + merge 100%)
        run: |
          uv run pytest \
            --cov=redact_ai \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=term \
            -q
          uv run pytest tests/unit/pipeline/test_redact.py tests/unit/pipeline/test_merge.py tests/golden \
            --cov=redact_ai.pipeline.redact \
            --cov=redact_ai.pipeline.merge \
            --cov-branch \
            --cov-fail-under=100 \
            -q
