[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redact-ai"
version = "0.1.0"
description = "Privacy-first preprocessing layer that detects and masks sensitive content in images before they reach an LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "redact-ai contributors" }]
keywords = ["privacy", "pii", "redaction", "ocr", "screenshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pillow==11.0.0",
    # HEIC/HEIF support (iPhone default photo format). Registers the
    # HEIF opener with Pillow on import.
    "pillow-heif==0.21.0",
    # AVIF support (modern web format). Pillow 11 has built-in AVIF only
    # when libavif is linked at build time; the plugin guarantees it.
    "pillow-avif-plugin==1.5.0",
    "pytesseract==0.3.13",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pyyaml==6.0.2",
    "python-multipart==0.0.19",
    "spacy==3.7.5",
    # opencv-python-headless ships the Haar face cascade used by ID-007
    # (ADR-012). The "headless" wheel drops GUI deps that we don't need
    # on a server-side redaction pipeline.
    "opencv-python-headless==4.10.0.84",
    # The en_core_web_md model wheel is fetched at install time so
    # `pip install redact-ai` is the only step a user needs (ADR-011).
    # Pinned to the spaCy 3.7-compatible release; bump in lockstep with
    # the `spacy` pin above.
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.7.1/en_core_web_md-3.7.1-py3-none-any.whl#sha256=6a0f857a2b4d219c6fa17d455f82430b365bf53171a2d919b9376e5dc9be032e",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
]
# Strong PII engine (ML-001 / ADR-013). Pulls the GLiNER runtime — and its
# torch/transformers/huggingface-hub chain — only when the user opts in. The
# model is fetched from Hugging Face on first load and cached on-device; the
# redaction hot path makes no network call (ADR-002). Enable ML-001 in policy
# (see examples/strong_policy.yaml) after installing this extra.
strong = [
    # Exact pins (matching every other dependency in this project) so the same
    # redact-ai release always resolves the same GLiNER/OpenMed/transformers/
    # torch code and ML-001/ML-002 stay reproducible. Bump deliberately.
    #
    # gliner 0.2.5 predates modern huggingface_hub and breaks with
    # `GLiNER._from_pretrained() missing ... 'proxies' and 'resume_download'`;
    # 0.2.27 tracks the current hub/transformers API.
    "gliner==0.2.27",
    # ML-002 (OpenMed) loads via a transformers token-classification pipeline,
    # so transformers is a direct dependency, not only gliner's transitive one.
    # Kept inside gliner 0.2.27's supported range (>=4.51.3,<5.7.0).
    "transformers==4.53.3",
    # Hard guard: spaCy 3.7.5 already requires numpy<2, but the strong extra's
    # transitive graph can otherwise drift numpy to 2.x, which breaks spaCy's
    # compiled thinc ABI (`numpy.dtype size changed`). Pin it explicitly so a
    # `[strong]` install keeps the base engines working.
    "numpy<2",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "httpx==0.28.1",
    "types-pyyaml==6.0.12.20240917",
]

[project.scripts]
redact-ai = "redact_ai.__main__:main"

[project.urls]
Homepage = "https://github.com/nadeem-shaikh/redact-ai"
Repository = "https://github.com/nadeem-shaikh/redact-ai"
Issues = "https://github.com/nadeem-shaikh/redact-ai/issues"

[tool.hatch.metadata]
# `en-core-web-md` is a direct-URL dependency (ADR-011); hatchling
# refuses these by default because PyPI rejects them in published
# packages. v0.1 distribution is via clone / git / uv, so the
# override is safe here. When v0.2 ships to PyPI this flag is
# removed and the model is vendored or first-run-fetched instead.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/redact_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/redact_ai/resources/DejaVuSans-Bold.ttf" = "redact_ai/resources/DejaVuSans-Bold.ttf"

[tool.hatch.build.targets.sdist]
include = [
    "src/redact_ai",
    "examples/default_policy.yaml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "assets"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM103",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF013"]
# FastAPI uses ``File(...)``, ``Form(...)``, ``Header(...)`` as default
# values by design (B008 is a false positive for the framework).
"src/redact_ai/server/routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true
show_error_codes = true
files = ["src"]
exclude = ["tests/golden/_generate.py"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "PIL.*", "yaml.*", "spacy.*", "cv2.*"]
ignore_missing_imports = true

# transformers (ML-002) ships only in the [strong] extra, so it is present when
# type-checking locally but absent in the lint/type CI job. `follow_imports=skip`
# makes mypy treat it as Any in *both* cases, so the detector type-checks
# identically with or without the extra installed (no environment-dependent
# unused-ignore churn).
[[tool.mypy.overrides]]
module = ["transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    # spaCy 3.7.5 imports click.parser.split_arg_string, which is
    # deprecated in click 8.3+ (removed in 9.0). Tracked upstream;
    # ignore until spaCy releases a fix.
    "ignore:Importing 'parser.split_arg_string' is deprecated.*:DeprecationWarning",
    # spaCy and pytesseract both import NumPy; when the test subset
    # only triggers one path then the other, NumPy logs a reload
    # UserWarning that has no functional impact on our pipeline.
    "ignore:The NumPy module was reloaded.*:UserWarning",
]

[tool.coverage.run]
source = ["redact_ai"]
branch = true
omit = [
    # PaddleOCR adapter is behind an opt-in extra (ADR-008) and is not
    # part of the v0.1 recall baseline; it's exercised only in the
    # optional paddle CI matrix.
    "src/redact_ai/pipeline/ocr/paddle.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
